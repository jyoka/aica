<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バイトル AIアシスタント</title>
<style>
  /* LINE トークルーム風(スマホ前提の1画面)。端末のダークモードに関係なくこの配色で固定。
     開発者画面(/dev の dev.html)と同じ部品・配色を使う */
  :root {
    --room: #8fa9d3; --head: #2f3a4f; --me: #95e05b; --bot: #fff; --text: #1a1d23; --sub: #5f6775; --faint: #8a93a3;
    --chip: #1f5fd1; --chip-line: #c9d6ee; --ok: #06c755; --ok-dark: #05a346; --ok-soft: #e7f8ee;
    --bg: #e4e8ef; --line: #e3e7ee; --soft: #f3f5f8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text);
         overflow-x: hidden; }
  button { font-family: inherit; }
  /* 1列だけ。広い画面でもスマホの幅で中央に置く */
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--room); overflow: hidden; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }

  header { background: var(--head); color: #fff; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
  header .name { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 今の雇用区分(表示だけ。確かめる・直すのはプロフィール) */
  header .track { flex: none; border-radius: 999px; background: #ffffff26; color: #fff; font-size: 11.5px; font-weight: 700; padding: 4px 10px; }
  header .track[hidden] { display: none; }

  /* ---------- トーク ---------- */
  #log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  #log > * { flex-shrink: 0; }  /* 一覧があふれても中身を縮めない(縮むと求人カードが途中で切れていた) */
  .sys { align-self: center; font-size: 11px; color: #fff; background: #0003; border-radius: 10px; padding: 3px 10px; margin: 4px 0; text-align: center; max-width: 92%; }
  .row { display: flex; gap: 8px; align-items: flex-end; } .row.me { justify-content: flex-end; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #d0021b; font-weight: 800; font-size: 13px;
            display: flex; align-items: center; justify-content: center; flex: none; align-self: flex-start; }
  .col { display: flex; flex-direction: column; gap: 4px; max-width: 80%; min-width: 0; }
  .who { font-size: 11px; color: #fff; }
  .bubble { padding: 8px 12px; border-radius: 16px; line-height: 1.55; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  .bot .bubble { background: var(--bot); } .me .bubble { background: var(--me); }
  .time { font-size: 10px; color: #eef2fa; white-space: nowrap; }
  .typing { display: inline-flex; align-items: center; gap: 4px; padding: 11px 14px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #b7bec9; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3 } 40% { opacity: 1 } }
  /* 時間のかかるツールの間だけ、点の前に「何をしているか」の一言を出す */
  .typing .wait { font-size: 12.5px; color: var(--sub); margin-right: 4px; }

  /* 求人カード(LINE の Flex Message のカルーセル風)。横にはカルーセルの中だけでスクロールする */
  .cards { display: flex; gap: 8px; overflow-x: auto; margin-left: 40px; max-width: calc(100% - 40px); padding: 2px 12px 6px 0;
           scroll-snap-type: x mandatory; }
  .jc { flex: none; width: 236px; max-width: 100%; background: #fff; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
        scroll-snap-align: start; box-shadow: 0 1px 2px #0000001a; }
  .jc .in { padding: 12px 13px 10px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .jc .meta { font-size: 11px; color: var(--faint); }
  .jc .ttl { font-size: 14.5px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .jc .emp { font-size: 11.5px; color: var(--sub); margin-top: -3px; }
  .jc .wage { display: flex; align-items: baseline; gap: 4px; }
  .jc .wage small { font-size: 11px; color: var(--sub); } .jc .wage b { font-size: 21px; color: var(--ok-dark); letter-spacing: .01em; }
  .jc .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .jc .tag { font-size: 11px; background: var(--soft); color: #3a4150; border-radius: 6px; padding: 3px 7px; }
  .jc .tag.perk { background: #fff4e0; color: #8a5300; }
  .jc .why { font-size: 11.5px; line-height: 1.5; background: var(--ok-soft); color: #1f6b3a; border-radius: 8px; padding: 6px 8px; }
  .jc .why span { font-weight: 700; margin-right: 4px; }
  .jc .btns { display: flex; border-top: 1px solid var(--line); }
  .jc .btns button { flex: 1; border: 0; background: #fff; padding: 11px 0; font-size: 13px; font-weight: 700; cursor: pointer; }
  .jc .btns button + button { border-left: 1px solid var(--line); }
  .jc .btns .go { color: var(--ok-dark); } .jc .btns .keep { color: var(--sub); }
  .liff { margin-left: 40px; }
  .liff a { display: inline-block; background: var(--ok); color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; border-radius: 10px; padding: 9px 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 4px 40px; }
  .chips button { background: #fff; color: var(--chip); border: 1px solid var(--chip-line); border-radius: 16px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chips button:disabled { color: #9aa7bd; cursor: default; }
  form { display: flex; gap: 8px; padding: 8px 10px; background: #fff; border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; font-size: 16px; padding: 9px 14px; border: 0; border-radius: 20px; background: #f1f3f6; outline: none; }
  form button { border: 0; background: none; color: var(--ok); font-weight: 700; font-size: 15px; cursor: pointer; flex: none; }
  form button:disabled { color: #b8c0cc; }

  /* ---------- 保存した求人・プロフィール ---------- */
  .page { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg); padding: 14px 12px; }
  .page h2 { font-size: 15px; margin: 0 0 10px; }
  .page .note { color: var(--sub); font-size: 13px; line-height: 1.6; }
  .saved-list { display: flex; flex-direction: column; gap: 10px; }
  .saved-list .jc { width: 100%; }

  /* わたしのプロフィール: 覚えていることを項目ごとのカードで。直す・消すはその場で */
  .pcard { background: #fff; border-radius: 14px; padding: 12px 13px; margin-bottom: 10px; box-shadow: 0 1px 2px #0000001a; }
  .pcard h3 { font-size: 14px; margin: 0 0 6px; }
  .prow { border-top: 1px solid var(--line); padding: 8px 0; display: flex; flex-direction: column; gap: 4px; }
  .pcard h3 + .prow, .pcard h3 + .pnote + .prow { border-top: 0; }
  .prow .pl { font-size: 11.5px; color: var(--sub); }
  .pcard .pv { font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .pcard .pv.empty { color: var(--faint); }
  .pcard .pv small { color: var(--faint); font-size: 11px; margin-left: 6px; }
  .pbtns { display: flex; flex-wrap: wrap; gap: 6px; }
  .pbtns button, .pbtns a { border: 1px solid var(--chip-line); background: #fff; color: var(--chip); border-radius: 14px; padding: 4px 11px;
                            font-size: 12.5px; cursor: pointer; text-decoration: none; }
  .pbtns button.del { color: #c0392b; border-color: #f0c9c4; }
  .pbtns button.ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
  .pedit { display: flex; flex-direction: column; gap: 6px; }
  .pedit textarea { font: inherit; font-size: 16px; padding: 8px 10px; border: 1px solid #ccd; border-radius: 10px; resize: vertical; min-height: 44px; }
  .perr { color: #c0392b; font-size: 12.5px; }
  .pnote { color: var(--sub); font-size: 12px; line-height: 1.55; margin: 0 0 6px; }
  .pconfirm { background: #fff7e6; border-radius: 10px; padding: 8px 10px; font-size: 13px; line-height: 1.6; display: flex; flex-direction: column; gap: 6px; }
  .pcard.danger h3 { color: #c0392b; }
  .pbtns button.danger { background: #e5484d; border-color: #e5484d; color: #fff; font-weight: 700; }

  /* ---------- 下のナビ(トーク / 保存した求人 / プロフィール) ---------- */
  nav.bottom { display: flex; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.bottom button { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 2px 9px; font-size: 11px; font-weight: 700; color: var(--faint);
                      display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  nav.bottom button .i { font-size: 18px; line-height: 1; }
  nav.bottom button.on { color: var(--ok-dark); }
</style>
<link rel="stylesheet" href="/static/talk-core.css">
</head>
<body>
<div class="app">
  <header><span class="name">バイトル</span><span class="track" id="track" hidden></span></header>
  <main>
    <section class="view" id="v-talk">
      <div id="log"></div>
      <form id="f"><input id="t" autocomplete="off" maxlength="5000" placeholder="メッセージを入力"><button id="send">送信</button></form>
    </section>
    <section class="view" id="v-saved" hidden>
      <div class="page"><h2>保存した求人</h2><div class="saved-list" id="saved"></div></div>
    </section>
    <section class="view" id="v-profile" hidden>
      <div class="page" id="profile"><h2>わたしのプロフィール</h2><p class="note">読み込み中です。</p></div>
    </section>
  </main>
  <nav class="bottom" id="nav">
    <button type="button" data-view="talk" class="on"><span class="i">💬</span>トーク</button>
    <button type="button" data-view="saved"><span class="i">🔖</span>保存した求人</button>
    <button type="button" data-view="profile"><span class="i">👤</span>プロフィール</button>
  </nav>
</div>
<script src="/static/talk-core.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("t"), sendBtn = $("send");
  let current = null, busy = false;  // current: このブラウザのユーザーID(匿名ID そのもの)
  let thread = null;  // この画面が表示している会話の番号(発言のときに送り、別のタブで会話が替わっていないかを照合する)
  let track = null;  // 今の雇用区分(setTrack が直す。「+」メニューの音声相談の説明が、書類の呼び方を合わせるのに使う)
  let reopen = false;  // 今の会話が閉じられた(プロフィールで履歴書を消した): 次にトークを出すとき開き直す

  // トークの部品(吹き出し・求人カード・返信の描画・「+」メニュー・履歴書・音声)は /dev と共通(talk-core.js)
  const talk = createTalk({
    log, form: $("f"), getUser: () => current, isBusy: () => busy, setBusy,
    send: (text) => send(text), fire: (event) => fire(event), showTalk: () => showView("talk"),
    getThread: () => thread, onStale: () => redrawLatest(), beforeTurn: () => showVoiceResult(),
    onTrack: (t) => setTrack(t), getTrack: () => track,
  });
  const { el, sys, me, botCol, disableChips, renderReply } = talk;
  function setBusy(on) { busy = on; sendBtn.disabled = on || !current; talk.setEnabled(!on && !!current); }

  // ヘッダーの今の雇用区分(dip の記録。開いたとき・返信・切り替えの取り消し・プロフィールで変えたときに直す)。
  // 未定のときは出さない(区分はプロフィールで確かめられる)
  const TRACK_HEADER = { "正社員": "正社員で相談中", "アルバイト・パート": "アルバイト・パートで相談中" };
  function setTrack(t) {
    const b = $("track");
    if (!t) return;
    track = t;
    b.textContent = TRACK_HEADER[t] || ""; b.dataset.track = t; b.hidden = !TRACK_HEADER[t];
  }

  function onEvent(ev, col) {
    talk.onStep(ev, col);  // 待ちの表示(tool_start / tools)
    if (ev.kind === "stale") {
      col.parentElement.remove();  // 別のタブで新しい会話が始まっていた(発言は送られていない)。fire が最新の会話を描き直す
    } else if (ev.kind === "thread") {
      thread = ev.thread;  // 挨拶で新しい会話が始まったら、その番号に替わる
    } else if (ev.kind === "reply") {
      if (ev.sent === false) col.parentElement.remove();  // 本番の画面はプッシュを起こさないので、ここには来ない
      else { if (ev.redacted) talk.redactedNote(col.parentElement); renderReply(ev, col); setTrack(ev.search_track); }
    } else if (ev.kind === "error") {
      talk.fail(col, "うまく返信できませんでした。少し時間をおいて、もう一度お試しください。");
      console.error(ev.message);
    }
  }

  async function fire(event, text) {
    if (busy || !current) return;
    setBusy(true); disableChips();
    const col = talk.typingCol();
    let stale = false;
    try {
      const res = await fetch("/api/event/stream", { method: "POST", headers: { "Content-Type": "application/json" },
                                                      body: JSON.stringify({ user_id: current, event, text, thread }) });
      if (!res.ok) throw new Error(res.status + " " + await res.text());
      await talk.readStream(res, (ev) => { onEvent(ev, col); if (ev.kind === "stale") stale = true; });
      if (stale) {
        if (text) input.value = text;  // 送られなかった発言は入力欄に戻す(送り直すかは本人が決める)
        await redrawLatest();
      }
    } catch (e) {
      talk.fail(col, "通信できませんでした。少し時間をおいて、もう一度お試しください。");
      console.error(e);
    }
    finally { setBusy(false); }
  }

  // 別のタブで新しい会話が始まっていた: 最新の会話を描き直す
  async function redrawLatest() {
    try { await restore(); sys("別の画面で新しい会話が始まりました。最新の会話を表示しています。"); }
    catch (e) { sys("別の画面で新しい会話が始まりました。ページを開き直してください。"); console.error(e); }
  }

  async function send(text) {
    if (busy || !current || !text.trim()) return;
    input.value = "";
    setBusy(true);
    try { await showVoiceResult(); } catch (e) { console.error(e); }
    setBusy(false);
    me(text);
    fire("message", text);
  }

  // 音声相談のシートを結果が届く前に閉じた: 結果は会話(LLM の文脈)に入るので、次のターンの前に履歴を読み直して描く
  async function showVoiceResult() {
    if (talk.voicePending() == null) return;
    talk.voiceShown((await restore()).turns);
  }
  $("f").onsubmit = (e) => { e.preventDefault(); send(input.value); };

  async function post(url, body) {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(res.status + " " + await res.text()); return res.json();
  }

  // ---------- 下のナビ: トーク / 保存した求人 / プロフィール ----------
  function showView(v) {
    for (const s of ["talk", "saved", "profile"]) $("v-" + s).hidden = s !== v;
    document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
    if (v === "saved") loadSaved();
    if (v === "profile") loadProfile();
    if (v === "talk") { if (reopen) { reopen = false; start(); } else talk.scroll(); }
  }
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => showView(b.dataset.view));

  async function loadSaved() {
    const box = $("saved");
    if (!current) { box.innerHTML = '<p class="note">読み込み中です。</p>'; return; }
    try {
      const jobs = (await (await fetch("/api/saved")).json()).jobs;
      box.innerHTML = "";
      if (!jobs.length) { box.appendChild(el("p", "note", "保存した求人はまだありません。トークで気になる求人の「保存」を押すと、ここに並びます。")); return; }
      jobs.forEach(j => box.appendChild(talk.jobCard(j, true)));
    } catch (e) { box.innerHTML = ""; box.appendChild(el("p", "note", "読み込めませんでした。")); }
  }

  // ---------- 今の会話の履歴を描き直す(再読み込み・別のタブで会話が替わったとき。LLM は呼ばない) ----------
  async function restore() {
    const res = await fetch("/api/talk/history");
    if (!res.ok) throw new Error(res.status + " " + await res.text());
    const h = await res.json();
    log.innerHTML = ""; thread = h.thread; setTrack(h.search_track);
    for (const t of h.turns) {
      if (t.user != null) me(t.user, "");
      if (t.redacted) talk.redactedNote();  // 保存してあるのは伏せた後の文(吹き出しにも [個人情報を削除] が出る)
      if (t.upload) { talk.meFile(t.upload.file, ""); talk.resumeConfirm(t.upload, botCol(), ""); }  // 履歴書を送ったターン
      if (t.bot) { disableChips(); renderReply(t.bot, botCol(), ""); }  // 選べるのは最後の返信の選択肢だけ
    }
    return h;
  }

  // ---------- わたしのプロフィール: aica が覚えていることを見る・直す・消す ----------
  // 読むのも変えるのも本人の匿名ID(Cookie)だけ。変えたことは次の返信の前に AI へ伝わる(サーバーの turn.profile_notice)
  async function api(method, url, body) {
    const res = await fetch(url, { method, headers: body ? { "Content-Type": "application/json" } : {},
                                   body: body ? JSON.stringify(body) : undefined });
    if (!res.ok) { let m = "うまくいきませんでした。もう一度お試しください。"; try { m = (await res.json()).detail || m; } catch (_) {} throw new Error(m); }
    return res.json();
  }
  const profileUrl = (path = "") => `/api/profile${path}`;  // 本人は Cookie で決まる(URL にユーザーIDは載せない)
  const EMPTY = "まだありません";
  // 「すべて消す」で消えるもの・消えないもの(docs/prd/aica-v2-fulltime.md の範囲)
  const FORGET_WHAT = "aica が覚えていること・保存した求人・応募・これまでの会話";
  const FORGET_KEPT = "その日の利用回数は消えません。";

  async function loadProfile() {
    const box = $("profile");
    if (!current) return;
    try { renderProfile(await api("GET", profileUrl())); }
    catch (e) { box.replaceChildren(el("h2", null, "わたしのプロフィール"), el("p", "note", "読み込めませんでした。")); console.error(e); }
  }
  // 変える操作をして、返ってきた最新のプロフィールで描き直す(失敗したら err に理由を出す)
  async function change(method, path, body, err) {
    try { renderProfile(await api(method, profileUrl(path), body)); return true; }
    catch (e) { if (err) err.textContent = e.message; else alert(e.message); return false; }
  }
  function btn(text, cls, onclick) { const b = el("button", cls, text); b.type = "button"; b.onclick = onclick; return b; }
  function card(title, note) {
    const c = el("div", "pcard"); c.appendChild(el("h3", null, title));
    if (note) c.appendChild(el("p", "pnote", note));
    return c;
  }
  // 確認の1段(消すと元に戻せないもの)
  function confirmIn(row, text, okText, run) {
    row.querySelector(".pconfirm")?.remove();
    const c = el("div", "pconfirm"), b = el("div", "pbtns");
    b.append(btn(okText, "danger", run), btn("やめる", null, () => c.remove()));
    c.append(el("span", null, text), b); row.appendChild(c);
  }
  // 1項目の行: 値(無ければ「まだありません」)と、直す・消す。直すと本人の言葉で上書き
  function itemRow(label, value, saved, path, multiline) {
    const row = el("div", "prow"); row.dataset.key = path;
    row.appendChild(el("span", "pl", label));
    const v = el("div", "pv" + (value ? "" : " empty"), value || EMPTY);
    if (value && saved) v.appendChild(el("small", null, `${saved}`));
    const btns = el("div", "pbtns");
    btns.appendChild(btn("直す", "edit", () => {
      const f = el("div", "pedit"), t = el("textarea"), err = el("div", "perr"), b = el("div", "pbtns");
      t.value = value || ""; t.rows = multiline ? 4 : 1; t.setAttribute("aria-label", label);
      b.append(btn("保存", "ok", () => change("PUT", `/items/${path}`, { value: t.value }, err)), btn("やめる", null, () => { f.remove(); btns.hidden = false; }));
      f.append(t, err, b); row.appendChild(f); btns.hidden = true; t.focus();
    }));
    if (value) btns.appendChild(btn("消す", "del", () => change("DELETE", `/items/${path}`)));
    row.append(v, btns); return row;
  }

  function renderProfile(p) {
    const box = $("profile");
    box.replaceChildren(el("h2", null, "わたしのプロフィール"),
      el("p", "note", "aica があなたについて覚えていることです。直したり消したりすると、次の返信から反映されます。"));

    // 雇用区分と、いつ・どの発言で切り替わったか。取り消し(トークの表示のボタンや会話で、直前の切り替えを元に戻した)は
    // 記録に残る。「記録ごと消す」は記録をすべて消して未定に戻すもので、取り消しとは別
    setTrack(p.track.current);
    const tc = card("雇用区分"), tr = el("div", "prow"); tr.dataset.key = "track";
    tr.append(el("div", "pv", p.track.current === "未定" ? "未定(まだ決まっていません)" : p.track.current));
    if (p.track.history.length) {
      for (const h of p.track.history) {
        const why = h.evidence.startsWith("(") ? h.evidence : `「${h.evidence}」で`;
        tr.appendChild(el("div", "pnote", h.undo ? `${h.when} 取り消し: ${h.from} → ${h.track} ${why}` : `${h.when} ${why} ${h.from} → ${h.track}`));
      }
    } else tr.appendChild(el("div", "pnote", "切り替えの記録は" + EMPTY));
    const tb = el("div", "pbtns");
    tb.appendChild(btn("直す", "edit", () => {
      tb.hidden = true; const b = el("div", "pbtns");
      for (const c of p.track.choices.filter(c => c !== p.track.current)) b.appendChild(btn(c, "ok", () => change("PUT", "/track", { track: c })));
      b.appendChild(btn("やめる", null, () => { b.remove(); tb.hidden = false; })); tr.appendChild(b);
    }));
    if (p.track.history.length) {
      tb.appendChild(btn("記録ごと消す", "del", () => confirmIn(tr,
        "区分と切り替えの記録をすべて消して、未定に戻します(直前の切り替えだけを元に戻すときは、トークの表示のボタンを使います)。",
        "記録ごと消す", () => change("DELETE", "/track"))));
    }
    tr.appendChild(tb); tc.appendChild(tr); box.appendChild(tc);

    // 目的・希望・経歴(本人が話したこと)
    for (const s of p.sections) {
      const c = card(s.title);
      for (const it of s.items) c.appendChild(itemRow(it.label, it.value, it.saved, it.key));
      box.appendChild(c);
    }
    // 相談のまとめ(前の会話を締めたときの記録。チャットと音声で引き継ぐ)
    const sc = card("相談のまとめ");
    const cs = p.consultation_summary;
    sc.appendChild(itemRow("前の会話で残したまとめ", cs ? cs.text : null, cs ? cs.recorded : null, "consultation_summary", true));
    box.appendChild(sc);

    // アップロードした履歴書の読み取り結果(全文は「読み取り結果を見る」)。丸ごと消せる
    const rc = card("履歴書の読み取り結果"), rr = el("div", "prow"); rr.dataset.key = "resume";
    if (p.resume) {
      rr.appendChild(el("div", "pv", p.resume.highlights.join("\n") || "読み取れた項目はありませんでした"));
      rr.appendChild(el("span", "pl", `${p.resume.uploaded} に${p.resume.file || "履歴書"}から読み取り`));
      const b = el("div", "pbtns"), a = el("a", null, "読み取り結果を見る");
      a.href = p.resume.view_url; a.target = "_blank"; a.rel = "noopener";
      b.append(a, btn("消す", "del", () => confirmIn(rr, "読み取り結果を丸ごと消します。チャットでも音声でも使われなくなります。今の会話は終わり、次は新しい会話から始まります。これまでの会話の記録も消えます。経験など、会話で保存した内容は残ります。プロフィールの各項目から消せます。", "消す", deleteResume)));
      rr.appendChild(b);
    } else rr.appendChild(el("div", "pv empty", EMPTY));
    rc.appendChild(rr); box.appendChild(rc);

    // 音声相談の結果(履歴書か職務経歴書の下書き。書類の名前は下書きの document_kind)
    const vc = card("音声相談の下書き");
    if (!p.voice_drafts.length) vc.appendChild(el("div", "pv empty", EMPTY));
    for (const d of p.voice_drafts) {
      const r = el("div", "prow"); r.dataset.key = `voice-${d.id}`;
      r.appendChild(el("div", "pv", `${d.at} の音声相談から作った${d.document_kind}の下書き`));
      const b = el("div", "pbtns"), a = el("a", null, "下書きを見る");
      a.href = d.view_url; a.target = "_blank"; a.rel = "noopener";
      b.append(a, btn("消す", "del", () => confirmIn(r, "この下書きを丸ごと消します。", "消す", () => change("DELETE", `/voice/${d.id}`))));
      r.appendChild(b); vc.appendChild(r);
    }
    box.appendChild(vc);

    // ゲーム(レジュメ・アーケード)で作った下書き。直すのは下書きの画面(/liff/arcade/draft)。ゲームへの入口もここに置く
    const gc = card("ゲームで作った下書き");
    if (!p.arcade_drafts.length) gc.appendChild(el("div", "pv empty", EMPTY));
    for (const d of p.arcade_drafts) {
      const r = el("div", "prow"); r.dataset.key = `arcade-${d.id}`;
      r.appendChild(el("div", "pv", `${d.at} に「${d.game}」で作った${d.document_kind}の下書き`));
      if (d.blanks) r.appendChild(el("span", "pl", `数字の空欄が${d.blanks}か所あります`));
      const b = el("div", "pbtns"), a = el("a", null, "見る・直す");
      a.href = d.view_url; a.target = "_blank"; a.rel = "noopener";
      b.append(a, btn("消す", "del", () => confirmIn(r, "この下書きを丸ごと消します。チャットでも使われなくなります。", "消す", () => change("DELETE", `/arcade/${d.id}`))));
      r.appendChild(b); gc.appendChild(r);
    }
    if (p.arcade_url) {
      const r = el("div", "prow"), b = el("div", "pbtns"), a = el("a", null, "ゲームで書類を作る");
      a.id = "arcade-link"; a.href = p.arcade_url; a.target = "_blank"; a.rel = "noopener";
      b.appendChild(a); r.appendChild(b); gc.appendChild(r);
    }
    box.appendChild(gc);

    // 保存した求人・応募した求人
    const jc = card("保存した求人");
    if (!p.saved_jobs.length) jc.appendChild(el("div", "pv empty", EMPTY));
    for (const j of p.saved_jobs) {
      const r = el("div", "prow"); r.dataset.key = `saved-${j.job_id}`;
      r.append(el("div", "pv", j.title), el("span", "pl", `${j.employer} · ${j.saved_at}に保存`));
      const b = el("div", "pbtns"); b.appendChild(btn("保存をやめる", "del", () => change("DELETE", `/saved/${encodeURIComponent(j.job_id)}`)));
      r.appendChild(b); jc.appendChild(r);
    }
    box.appendChild(jc);
    const ac = card("応募した求人");
    if (!p.applications.length) ac.appendChild(el("div", "pv empty", EMPTY));
    for (const a of p.applications) {
      const r = el("div", "prow"); r.append(el("div", "pv", a.title || a.job_id), el("span", "pl", `${a.applied}に応募 · ${a.status}`)); ac.appendChild(r);
    }
    box.appendChild(ac);

    // すべて消す(プロフィール・応募・会話を初期化。会話数の上限の数は消さない)。確認の1段を挟む
    const dc = card("すべて消す", `${FORGET_WHAT}をすべて消します。${FORGET_KEPT}次に開くと、はじめての訪問として始まります。`);
    dc.classList.add("danger");
    const dr = el("div", "prow"); dr.dataset.key = "forget";
    const db = el("div", "pbtns");
    db.appendChild(btn("すべて消す", "del", () => confirmIn(dr, `本当にすべて消しますか?${FORGET_WHAT}が消え、元に戻せません。${FORGET_KEPT}`, "すべて消す", forgetAll)));
    dr.appendChild(db); dc.appendChild(dr); box.appendChild(dc);
  }

  // 履歴書を消すと、サーバーは今の会話を閉じる: 前の会話を消して、次にトークを出すとき新しい会話(挨拶)から始める
  async function deleteResume() {
    if (!await change("DELETE", "/resume")) return;
    log.innerHTML = ""; thread = null; reopen = true;
  }

  async function forgetAll() {
    try { await api("POST", profileUrl("/forget")); }
    catch (e) { alert(e.message); return; }
    log.innerHTML = ""; thread = null; setTrack("未定");
    showView("talk"); start();  // 開き直す: dip は初回訪問として挨拶から始める
  }

  // ---------- 開いたら: 30分以内なら今の会話を続け、それ以外は初回訪問か再訪かを dip が決めて AI 側の1通目から始める ----------
  async function start() {
    setBusy(true);
    let opened;
    try {
      opened = await post("/api/talk/open", {}); current = opened.user; thread = opened.thread; setTrack(opened.search_track);
      if (opened.event == null) await restore();
    } catch (e) { sys("接続できませんでした。ページを開き直してください。"); console.error(e); return; }
    setBusy(false);
    if (opened.event != null) fire(opened.event);
  }
  start();
</script>
</body>
</html>
