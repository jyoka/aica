<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バイトル AIアシスタント</title>
<style>
  /* LINE トークルーム風(スマホ前提の1画面)。端末のダークモードに関係なくこの配色で固定。
     開発者画面(/dev の dev.html)と同じ部品・配色を使う */
  :root {
    --room: #8fa9d3; --head: #2f3a4f; --me: #95e05b; --bot: #fff; --text: #1a1d23; --sub: #5f6775; --faint: #8a93a3;
    --chip: #1f5fd1; --chip-line: #c9d6ee; --ok: #06c755; --ok-dark: #05a346; --ok-soft: #e7f8ee;
    --bg: #e4e8ef; --line: #e3e7ee; --soft: #f3f5f8;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; background: var(--bg); color: var(--text);
         overflow-x: hidden; }
  button { font-family: inherit; }
  /* 1列だけ。広い画面でもスマホの幅で中央に置く */
  .app { display: flex; flex-direction: column; height: 100dvh; max-width: 480px; margin: 0 auto; background: var(--room); overflow: hidden; }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .view[hidden] { display: none; }

  header { background: var(--head); color: #fff; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
  header .name { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #voice, #resume { border: 1px solid #ffffff55; background: #ffffff14; color: #fff; border-radius: 8px;
           padding: 5px 9px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; flex: none; }
  #voice:hover, #resume:hover { background: #ffffff2b; } #voice:disabled, #resume:disabled { opacity: .45; cursor: default; }

  /* ---------- トーク ---------- */
  #log { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 14px 12px 8px; display: flex; flex-direction: column; gap: 6px; }
  #log > * { flex-shrink: 0; }  /* 一覧があふれても中身を縮めない(縮むと求人カードが途中で切れていた) */
  .sys { align-self: center; font-size: 11px; color: #fff; background: #0003; border-radius: 10px; padding: 3px 10px; margin: 4px 0; text-align: center; max-width: 92%; }
  .row { display: flex; gap: 8px; align-items: flex-end; } .row.me { justify-content: flex-end; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: #fff; color: #d0021b; font-weight: 800; font-size: 13px;
            display: flex; align-items: center; justify-content: center; flex: none; align-self: flex-start; }
  .col { display: flex; flex-direction: column; gap: 4px; max-width: 80%; min-width: 0; }
  .who { font-size: 11px; color: #fff; }
  .bubble { padding: 8px 12px; border-radius: 16px; line-height: 1.55; font-size: 14.5px; white-space: pre-wrap; word-break: break-word; }
  .bot .bubble { background: var(--bot); } .me .bubble { background: var(--me); }
  .time { font-size: 10px; color: #eef2fa; white-space: nowrap; }
  .typing { display: inline-flex; align-items: center; gap: 4px; padding: 11px 14px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: #b7bec9; animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3 } 40% { opacity: 1 } }
  /* 時間のかかるツールの間だけ、点の前に「何をしているか」の一言を出す */
  .typing .wait { font-size: 12.5px; color: var(--sub); margin-right: 4px; }

  /* 求人カード(LINE の Flex Message のカルーセル風)。横にはカルーセルの中だけでスクロールする */
  .cards { display: flex; gap: 8px; overflow-x: auto; margin-left: 40px; max-width: calc(100% - 40px); padding: 2px 12px 6px 0;
           scroll-snap-type: x mandatory; }
  .jc { flex: none; width: 236px; max-width: 100%; background: #fff; border-radius: 14px; overflow: hidden; display: flex; flex-direction: column;
        scroll-snap-align: start; box-shadow: 0 1px 2px #0000001a; }
  .jc .in { padding: 12px 13px 10px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
  .jc .meta { font-size: 11px; color: var(--faint); }
  .jc .ttl { font-size: 14.5px; font-weight: 700; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .jc .emp { font-size: 11.5px; color: var(--sub); margin-top: -3px; }
  .jc .wage { display: flex; align-items: baseline; gap: 4px; }
  .jc .wage small { font-size: 11px; color: var(--sub); } .jc .wage b { font-size: 21px; color: var(--ok-dark); letter-spacing: .01em; }
  .jc .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .jc .tag { font-size: 11px; background: var(--soft); color: #3a4150; border-radius: 6px; padding: 3px 7px; }
  .jc .tag.perk { background: #fff4e0; color: #8a5300; }
  .jc .why { font-size: 11.5px; line-height: 1.5; background: var(--ok-soft); color: #1f6b3a; border-radius: 8px; padding: 6px 8px; }
  .jc .why span { font-weight: 700; margin-right: 4px; }
  .jc .btns { display: flex; border-top: 1px solid var(--line); }
  .jc .btns button { flex: 1; border: 0; background: #fff; padding: 11px 0; font-size: 13px; font-weight: 700; cursor: pointer; }
  .jc .btns button + button { border-left: 1px solid var(--line); }
  .jc .btns .go { color: var(--ok-dark); } .jc .btns .keep { color: var(--sub); }
  .liff { margin-left: 40px; }
  .liff a { display: inline-block; background: var(--ok); color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; border-radius: 10px; padding: 9px 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 4px 40px; }
  .chips button { background: #fff; color: var(--chip); border: 1px solid var(--chip-line); border-radius: 16px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .chips button:disabled { color: #9aa7bd; cursor: default; }
  form { display: flex; gap: 8px; padding: 8px 10px; background: #fff; border-top: 1px solid var(--line); }
  input { flex: 1; min-width: 0; font-size: 16px; padding: 9px 14px; border: 0; border-radius: 20px; background: #f1f3f6; outline: none; }
  form button { border: 0; background: none; color: var(--ok); font-weight: 700; font-size: 15px; cursor: pointer; flex: none; }
  form button:disabled { color: #b8c0cc; }

  /* ---------- 保存した求人・プロフィール ---------- */
  .page { flex: 1; min-height: 0; overflow-y: auto; background: var(--bg); padding: 14px 12px; }
  .page h2 { font-size: 15px; margin: 0 0 10px; }
  .page .note { color: var(--sub); font-size: 13px; line-height: 1.6; }
  .saved-list { display: flex; flex-direction: column; gap: 10px; }
  .saved-list .jc { width: 100%; }

  /* ---------- 下のナビ(トーク / 保存した求人 / プロフィール) ---------- */
  nav.bottom { display: flex; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.bottom button { flex: 1; min-width: 0; border: 0; background: none; padding: 8px 2px 9px; font-size: 11px; font-weight: 700; color: var(--faint);
                      display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
  nav.bottom button .i { font-size: 18px; line-height: 1; }
  nav.bottom button.on { color: var(--ok-dark); }
</style>
</head>
<body>
<div class="app">
  <header><span class="name">バイトル</span>
    <button type="button" id="resume" title="履歴書(PDF / JPEG / PNG)を読み取って、相談に使う">📄 履歴書</button>
    <input type="file" id="resume-file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" hidden>
    <button type="button" id="voice" title="音声アドバイザーと話す(別タブで開く)">🎤 音声で相談</button></header>
  <main>
    <section class="view" id="v-talk">
      <div id="log"></div>
      <form id="f"><input id="t" autocomplete="off" placeholder="メッセージを入力"><button id="send">送信</button></form>
    </section>
    <section class="view" id="v-saved" hidden>
      <div class="page"><h2>保存した求人</h2><div class="saved-list" id="saved"></div></div>
    </section>
    <section class="view" id="v-profile" hidden>
      <div class="page"><h2>プロフィール</h2><p class="note">準備中です。</p></div>
    </section>
  </main>
  <nav class="bottom" id="nav">
    <button type="button" data-view="talk" class="on"><span class="i">💬</span>トーク</button>
    <button type="button" data-view="saved"><span class="i">🔖</span>保存した求人</button>
    <button type="button" data-view="profile"><span class="i">👤</span>プロフィール</button>
  </nav>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const log = $("log"), input = $("t"), sendBtn = $("send");
  let current = null, busy = false;  // current: このブラウザのユーザーID(匿名ID そのもの)
  let thread = null;  // この画面が表示している会話の番号(発言のときに送り、別のタブで会話が替わっていないかを照合する)

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const now = () => new Date().toTimeString().slice(0, 5);
  const scroll = () => { log.scrollTop = log.scrollHeight; };
  const yen = (n) => Number(n).toLocaleString("ja-JP");

  // ---------- トークルーム ----------
  function sys(text) { log.appendChild(el("div", "sys", text)); scroll(); }
  // time: 描き直した履歴は送った時刻が分からないので出さない("")
  function me(text, time = now()) { const r = el("div", "row me"); if (time) r.appendChild(el("span", "time", time)); r.appendChild(el("div", "bubble", text)); log.appendChild(r); scroll(); }
  function botCol() {
    const r = el("div", "row bot"), c = el("div", "col");
    r.append(el("div", "avatar", "B"), c); c.appendChild(el("span", "who", "バイトル"));
    log.appendChild(r); scroll(); return c;
  }
  function disableChips() { log.querySelectorAll(".chips button").forEach(b => b.disabled = true); }
  function setBusy(on) { busy = on; sendBtn.disabled = on || !current; $("resume").disabled = on || !current; }

  // 時間のかかるツールの待ち時間に出す一言(tool_start で出し、tools / reply / error で消す)。
  // 一覧に無いツールは速いので、通常の「…」のまま
  const WAIT_LABEL = {
    recommend_jobs: (args) => (args?.exclude_ids?.length ? "🔍 ほかの求人を探しています…" : "🔍 ぴったりの求人を探しています…"),
    relax_conditions: () => "🔍 条件を見直して探しています…",
  };
  function setWait(col, label) {
    const typing = col.querySelector(".typing");
    if (!typing) return;
    typing.querySelector(".wait")?.remove();
    if (label) { typing.prepend(el("span", "wait", label)); scroll(); }
  }

  // saved: 「保存した求人」の一覧に出すカード(保存ボタンは出さず、トークで聞くだけ)
  function jobCard(j, saved = false) {
    const c = el("div", "jc"), inner = el("div", "in");
    inner.append(el("div", "meta", `${j.job_type} · ${j.area}` + (j.saved_at ? ` · ${j.saved_at}に保存` : "")),
                 el("div", "ttl", j.title), el("div", "emp", j.employer));
    const w = el("div", "wage"); w.append(el("small", null, "時給"), el("b", null, `${yen(j.hourly_wage)}円`)); inner.appendChild(w);
    const tags = el("div", "tags");
    for (const t of [j.shift, `週${j.days_min}日〜`, `${j.station.replace(/駅$/, "")}駅 徒歩${j.walk_min}分`]) tags.appendChild(el("span", "tag", t));
    for (const p of (j.perks || []).slice(0, 3)) tags.appendChild(el("span", "tag perk", p));  // アピールポイント(待遇)
    inner.appendChild(tags);
    if (j.reasons?.length) { const why = el("div", "why"); why.append(el("span", null, "おすすめ"), document.createTextNode(j.reasons.join(" / "))); inner.appendChild(why); }
    const btns = el("div", "btns");
    const more = el("button", "go", saved ? "トークで詳しく聞く" : "詳しく見る"); more.type = "button";
    more.onclick = () => { showView("talk"); send(`「${j.title}」について詳しく教えて`); };
    btns.appendChild(more);
    if (!saved) { const keep = el("button", "keep", "保存"); keep.type = "button"; keep.onclick = () => send(`「${j.title}」(${j.job_id})を保存して`); btns.appendChild(keep); }
    c.append(inner, btns); return c;
  }

  function renderReply(r, col, time = now()) {
    col.querySelector(".typing")?.remove();
    for (const b of r.bubbles) col.appendChild(el("div", "bubble", b));
    if (r.bubbles.length && time) col.appendChild(el("span", "time", time));
    if (r.cards.length) { const box = el("div", "cards"); r.cards.forEach(j => box.appendChild(jobCard(j))); log.appendChild(box); }
    for (const b of r.buttons) {
      const w = el("div", "liff"), a = el("a", null, b.label);
      a.href = b.url; a.target = "_blank"; a.rel = "noopener"; w.appendChild(a); log.appendChild(w);
    }
    if (r.quick_replies.length) {
      const box = el("div", "chips");
      for (const q of r.quick_replies) { const b = el("button", null, q); b.type = "button"; b.onclick = () => send(q); box.appendChild(b); }
      log.appendChild(box);
    }
    scroll();
  }

  function onEvent(ev, col) {
    if (ev.kind === "tool_start") {
      const slow = ev.calls.find(c => WAIT_LABEL[c.name]);
      if (slow) setWait(col, WAIT_LABEL[slow.name](slow.args));
    } else if (ev.kind === "tools") {
      setWait(col, null);  // ツールが終わったら「何をしているか」を消す(続きは通常の「…」)
    } else if (ev.kind === "stale") {
      col.parentElement.remove();  // 別のタブで新しい会話が始まっていた(発言は送られていない)。fire が最新の会話を描き直す
    } else if (ev.kind === "thread") {
      thread = ev.thread;  // 挨拶で新しい会話が始まったら、その番号に替わる
    } else if (ev.kind === "reply") {
      if (ev.sent === false) col.parentElement.remove();  // 本番の画面はプッシュを起こさないので、ここには来ない
      else renderReply(ev, col);
    } else if (ev.kind === "error") {
      col.querySelector(".typing")?.remove(); col.appendChild(el("div", "bubble", "うまく返信できませんでした。少し時間をおいて、もう一度お試しください。"));
      console.error(ev.message);
    }
  }

  async function fire(event, text) {
    if (busy || !current) return;
    setBusy(true); disableChips();
    const col = botCol(); const typing = el("div", "bubble typing"); typing.append(el("i"), el("i"), el("i")); col.appendChild(typing); scroll();
    let stale = false;
    try {
      const res = await fetch("/api/event/stream", { method: "POST", headers: { "Content-Type": "application/json" },
                                                      body: JSON.stringify({ user_id: current, event, text, thread }) });
      if (!res.ok) throw new Error(res.status + " " + await res.text());
      const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
      for (;;) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, i); buf = buf.slice(i + 1);
          if (!line.trim()) continue;
          const ev = JSON.parse(line); onEvent(ev, col); if (ev.kind === "stale") stale = true;
        }
      }
      if (stale) {
        if (text) input.value = text;  // 送られなかった発言は入力欄に戻す(送り直すかは本人が決める)
        try { await restore(); sys("別の画面で新しい会話が始まりました。最新の会話を表示しています。"); }
        catch (e) { sys("別の画面で新しい会話が始まりました。ページを開き直してください。"); console.error(e); }
      }
    } catch (e) {
      typing.remove(); col.appendChild(el("div", "bubble", "通信できませんでした。少し時間をおいて、もう一度お試しください。"));
      console.error(e);
    }
    finally { setBusy(false); }
  }

  function send(text) {
    if (busy || !current || !text.trim()) return;
    me(text); input.value = "";
    fire("message", text);
  }
  $("f").onsubmit = (e) => { e.preventDefault(); send(input.value); };

  async function post(url, body) {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(res.status + " " + await res.text()); return res.json();
  }

  // ---------- 下のナビ: トーク / 保存した求人 / プロフィール ----------
  function showView(v) {
    for (const s of ["talk", "saved", "profile"]) $("v-" + s).hidden = s !== v;
    document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.view === v));
    if (v === "saved") loadSaved();
    if (v === "talk") scroll();
  }
  document.querySelectorAll("#nav button").forEach(b => b.onclick = () => showView(b.dataset.view));

  async function loadSaved() {
    const box = $("saved");
    if (!current) { box.innerHTML = '<p class="note">読み込み中です。</p>'; return; }
    try {
      const jobs = (await (await fetch(`/api/saved/${encodeURIComponent(current)}`)).json()).jobs;
      box.innerHTML = "";
      if (!jobs.length) { box.appendChild(el("p", "note", "保存した求人はまだありません。トークで気になる求人の「保存」を押すと、ここに並びます。")); return; }
      jobs.forEach(j => box.appendChild(jobCard(j, true)));
    } catch (e) { box.innerHTML = ""; box.appendChild(el("p", "note", "読み込めませんでした。")); }
  }

  // ---------- 音声相談(voice-resume との連携) ----------
  // トークの「音声で相談」から LIFF のように別タブで開く。相談が終わると voice-resume が
  // /api/voice/result に結果(dip の求人・下書き)を送り、ここが pull で受け取ってトークに描く。
  $("voice").onclick = () => {
    if (!current) return;
    window.open("/liff/voice?user=" + encodeURIComponent(current), "_blank", "noopener");
    sys("別タブで音声アドバイザーが開きます。相談が終わると、結果がこのトークに届きます。");
  };
  async function pollVoice() {
    if (!current || busy) return;  // ターンの途中には差し込まない(次の周回で受け取る)
    let results;
    try { results = (await post(`/api/voice/${encodeURIComponent(current)}/pull`, {})).results; }
    catch (e) { return; }  // 再起動中など。次の周回でまた試す
    for (const r of results || []) {
      sys("音声相談の結果が届きました");
      const col = botCol();
      renderReply({
        bubbles: ["音声の相談でお話しした内容です。ご提案した求人と、履歴書の下書きをご確認ください。"],
        cards: r.cards || [],
        buttons: r.draft_markdown ? [{ label: "履歴書の下書きを見る", url: `/liff/voice/draft?user=${encodeURIComponent(current)}&rid=${r.id}` }] : [],
        quick_replies: [],
      }, col);
    }
  }
  setInterval(pollVoice, 4000);

  // ---------- 履歴書のアップロード(resume-intake) ----------
  // ファイルを選ぶ → /api/resume/{user}/upload で読み取り(dip の状態に保存)→ 結果の確認をトークに出す。
  // 「この内容で相談する」を押すと、同じユーザーの会話が読み取り結果(summary の uploaded_resume)を参照して続く。
  // 氏名・連絡先は保存されないので、トークにも出さない(ファイル名も出さない。氏名が入りがちなため)。
  $("resume").onclick = () => { if (current && !busy) $("resume-file").click(); };
  $("resume-file").onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = "";
    if (!f || !current || busy) return;
    showView("talk"); setBusy(true); disableChips();
    sys("アップロードした履歴書を読み取っています…");
    const col = botCol(); const typing = el("div", "bubble typing"); typing.append(el("i"), el("i"), el("i")); col.appendChild(typing); scroll();
    try {
      const fd = new FormData(); fd.append("file", f);
      const res = await fetch(`/api/resume/${encodeURIComponent(current)}/upload`, { method: "POST", body: fd });
      if (!res.ok) { let m = res.status + ""; try { m = (await res.json()).detail || m; } catch (_) {} throw new Error(m); }
      renderResume(await res.json(), col);
    } catch (err) {
      typing.remove(); col.appendChild(el("div", "bubble", "履歴書を読み取れませんでした: " + err.message));
    } finally { setBusy(false); }
  };
  function renderResume(d, col) {
    // 吹き出しの中身(要点だけ・80字以内)はサーバーが組み立てる(line_runtime/resume_confirm.py)
    renderReply({ bubbles: d.bubbles.slice(0, 3), cards: [], quick_replies: [],
                  buttons: d.empty ? [] : [{ label: "読み取り結果を見る", url: d.view_url }] }, col);
    if (!d.empty) {
      const box = el("div", "chips"), b = el("button", null, "この内容で相談する"); b.type = "button";
      b.onclick = () => send("履歴書をアップロードしました。この内容をふまえて相談させてください。");
      box.appendChild(b); log.appendChild(box); scroll();
    }
  }

  // ---------- 今の会話の履歴を描き直す(再読み込み・別のタブで会話が替わったとき。LLM は呼ばない) ----------
  async function restore() {
    const res = await fetch(`/api/talk/history/${encodeURIComponent(current)}`);
    if (!res.ok) throw new Error(res.status + " " + await res.text());
    const h = await res.json();
    log.innerHTML = ""; thread = h.thread;
    for (const t of h.turns) {
      if (t.user != null) me(t.user, "");
      if (t.bot) { disableChips(); renderReply(t.bot, botCol(), ""); }  // 選べるのは最後の返信の選択肢だけ
    }
  }

  // ---------- 開いたら: 30分以内なら今の会話を続け、それ以外は初回訪問か再訪かを dip が決めて AI 側の1通目から始める ----------
  (async () => {
    setBusy(true); $("voice").disabled = true;
    let opened;
    try {
      opened = await post("/api/talk/open", {}); current = opened.user; thread = opened.thread;
      if (opened.event == null) await restore();
    } catch (e) { sys("接続できませんでした。ページを開き直してください。"); console.error(e); return; }
    $("voice").disabled = false; setBusy(false);
    if (opened.event != null) fire(opened.event);
  })();
</script>
</body>
</html>
