# Render の Blueprint(docs/deploy/render.md)。運営者が Render のダッシュボードで「New → Blueprint」からこのリポジトリを選ぶ。
# sync: false の値は、Blueprint を作るときにダッシュボードで入れる(リポジトリには書かない)。
services:
  - type: web
    name: aica
    runtime: docker
    # 音声ワーカーも同じコンテナで動かす。Starter(512MB)では足りないので Standard(2GB)
    plan: standard
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    # 永続ディスクは 1 つのインスタンスにしかつながらない。会話数の上限もプロセス 1 つで数える
    numInstances: 1
    disk:
      name: aica-data
      mountPath: /app/data
      # 音声のモデル(約 460MB)も置く。増やせるが減らせない
      sizeGB: 2
    envVars:
      # トーク、ゲームの AI、履歴書の読み取り、音声相談(既定の LINE_SIM_PROVIDER=anthropic)
      - key: ANTHROPIC_API_KEY
        sync: false
      # 求人の意味検索の埋め込み(Anthropic には埋め込みの API がない。無ければ部分一致の検索に戻る)
      - key: OPENAI_API_KEY
        sync: false
      # Render のプロキシの後ろなので、IP を X-Forwarded-For の最後の値から取る
      - key: AICA_TRUST_PROXY
        value: "1"
      # Web プロセスと音声ワーカー(同じコンテナ)が同じ値を読む
      - key: AICA_INTERNAL_KEY
        generateValue: true
      # 本番の文字起こしは Deepgram に固定する。openai にすると声そのものが OpenAI に届く(docs/design/privacy.md の 3.2)
      - key: VOICE_RESUME_STT_PROVIDER
        value: deepgram
      # 音声相談(docs/deploy/render.md の「音声相談」)。音声ワーカーを同じコンテナで動かす
      - key: AICA_VOICE_WORKER
        value: "1"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
