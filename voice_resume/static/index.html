<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声で棚卸し(履歴書の下書きと求人の提案)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f7fa; color: #1c2733; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; }
  .note { color: #5b6b7b; font-size: 13px; }
  button { font-size: 16px; padding: 10px 22px; border: 0; border-radius: 999px; cursor: pointer; }
  #start { background: #2f6fed; color: #fff; font-weight: 700; }
  #end { background: #e8edf3; color: #1c2733; display: none; }
  #status { margin: 12px 0; font-size: 14px; color: #37506b; min-height: 1.4em; }
  /* 時間のかかるツール(求人検索・調べもの)の間だけ出す「何をしているか」の表示 */
  #working { display: none; align-items: center; gap: 5px; margin: 10px 0; padding: 9px 14px; width: fit-content;
             background: #fff; border: 1px solid #dde5ee; border-radius: 999px; font-size: 14px; color: #37506b; }
  #working i { width: 6px; height: 6px; border-radius: 50%; background: #90a2b8; animation: blink 1.2s infinite; }
  #working i:nth-child(2) { animation-delay: .2s; } #working i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .3 } 40% { opacity: 1 } }
  #captions { background: #fff; border: 1px solid #dde5ee; border-radius: 10px; padding: 12px 16px;
              min-height: 120px; max-height: 320px; overflow-y: auto; font-size: 14px; }
  .cap { margin: 6px 0; }
  .cap .who { font-weight: 700; margin-right: 6px; }
  .cap.user .who { color: #2f6fed; }
  .cap.agent .who { color: #0a8f6a; }
  .job { background: #fff; border: 1px solid #cfe3d8; border-left: 6px solid #0a8f6a;
         border-radius: 10px; padding: 12px 16px; margin: 10px 0; }
  .job h3 { margin: 0 0 4px; font-size: 15px; }
  .job .meta { font-size: 13px; color: #37506b; }
  .job .reasons { font-size: 13px; color: #0a6b52; margin-top: 4px; }
  #draft { background: #fff; border: 1px solid #dde5ee; border-radius: 10px; padding: 12px 16px;
           white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; display: none; }
  section h2 { font-size: 16px; margin: 24px 0 8px; }
</style>
</head>
<body>
<main>
  <h1>🎤 音声で棚卸し(履歴書の下書きと求人の提案)</h1>
  <p class="note">
    アドバイザーと日本語で話しながら、バイト探しの希望と経験を5分ほどで聞き取ります。
    最後に条件に合う求人の提案と、履歴書の下書きができます。
    氏名・住所・電話番号などの個人情報は聞かれません(話しても記録されません)。
  </p>
  <p>
    <button id="start">面談をはじめる</button>
    <button id="end">面談を終える(下書きを保存)</button>
  </p>
  <div id="status">未接続です。「面談をはじめる」を押すとマイクの許可を求めます。</div>
  <div id="working"><span id="working-label"></span><i></i><i></i><i></i></div>

  <section>
    <h2>会話</h2>
    <div id="captions"></div>
  </section>

  <section id="jobs-section" style="display:none">
    <h2>ご提案した求人</h2>
    <div id="jobs"></div>
  </section>

  <section id="draft-section" style="display:none">
    <h2>履歴書の下書き(必ずご自身で確認・修正してください)</h2>
    <div id="draft"></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const status = (m) => { $("status").textContent = m; };
let room = null;
// トーク(line_runtime)の「音声で相談」から開かれたときは ?user=<匿名ユーザーID のスコープ> が付く。
// この相談の結果(求人・下書き)は、終わるとトークにも戻る。
const userId = new URLSearchParams(location.search).get("user");
if (userId) {
  const p = document.createElement("p");
  p.className = "note";
  p.textContent = "トークから開いています(" + userId + ")。相談が終わると、提案した求人と下書きがトークにも届きます。";
  document.querySelector("main p.note").after(p);
}

// アドバイザーが「何をしているか」(求人検索・調べもの)の表示。始まり(label)で出し、終わり(done)で消す。
// 万一「終わり」が届かなくても(接続断・タイムアウト)、出しっぱなしにしない
let workingTimer = null;
function showWorking(label) {
  clearTimeout(workingTimer);
  $("working").style.display = label ? "inline-flex" : "none";
  $("working-label").textContent = label || "";
  if (label) workingTimer = setTimeout(() => showWorking(null), 60000);
}

const segs = new Map();  // segment_id -> caption 要素(途中経過を同じ行に上書き)
function caption(id, who, text, isUser) {
  let el = segs.get(id);
  if (!el) {
    el = document.createElement("div");
    el.className = "cap " + (isUser ? "user" : "agent");
    el.innerHTML = '<span class="who"></span><span class="text"></span>';
    el.querySelector(".who").textContent = who;
    $("captions").appendChild(el);
    segs.set(id, el);
  }
  el.querySelector(".text").textContent = text;
  $("captions").scrollTop = $("captions").scrollHeight;
}

function showJobs(jobs, total) {
  $("jobs-section").style.display = "";
  $("jobs").innerHTML = "";
  if (!jobs.length) { $("jobs").textContent = "条件に合う求人が見つかりませんでした。"; return; }
  for (const j of jobs) {
    const d = document.createElement("div");
    d.className = "job";
    const meta = [j.job_type, j.area, j.station ? j.station.replace(/駅$/, "") + "駅" : "", "時給" + j.hourly_wage + "円",
                  j.shift].filter(Boolean).join(" / ");
    d.innerHTML = "<h3></h3><div class='meta'></div><div class='reasons'></div>";
    d.querySelector("h3").textContent = (j.title || "") + "(" + (j.employer || "") + ")";
    d.querySelector(".meta").textContent = meta + "(求人ID: " + j.job_id + ")";
    d.querySelector(".reasons").textContent = (j.reasons || []).join(" / ");
    $("jobs").appendChild(d);
  }
}

$("start").onclick = async () => {
  try {
    $("start").disabled = true;
    status("接続の準備をしています…");
    const res = await fetch("/api/token", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId }),
    });
    if (!res.ok) throw new Error(await res.text());
    const { url, token } = await res.json();

    room = new LivekitClient.Room();
    room.on("trackSubscribed", (track) => {
      if (track.kind === "audio") document.body.appendChild(track.attach());
    });
    room.on("dataReceived", (payload, _p, _k, topic) => {
      if (topic !== "voice-resume") return;
      try {
        const msg = JSON.parse(new TextDecoder().decode(payload));
        if (msg.type === "status") showWorking(msg.done ? null : msg.label);
        if (msg.type === "jobs") showJobs(msg.jobs || [], msg.total || 0);
        if (msg.type === "draft") {
          $("draft-section").style.display = "";
          $("draft").style.display = "block";
          $("draft").textContent = msg.markdown || "";
          status("下書きを保存しました: " + (msg.files || []).join(" , "));
        }
      } catch (e) { /* 無視 */ }
    });
    // 文字起こし(本人・アドバイザーの両方)はテキストストリームで届く
    room.registerTextStreamHandler("lk.transcription", async (reader, participant) => {
      const isUser = participant.identity === room.localParticipant.identity;
      const id = reader.info.attributes["lk.segment_id"] || reader.info.id;
      let text = "";
      for await (const chunk of reader) { text += chunk; caption(id, isUser ? "あなた" : "アドバイザー", text, isUser); }
    });
    room.on("disconnected", () => { showWorking(null); status("切断しました。もう一度始めるにはページを再読み込みしてください。"); });

    await room.connect(url, token);
    // エコー(スピーカーの音をマイクが拾う)対策: echoCancellation を明示的に有効にする
    await room.localParticipant.setMicrophoneEnabled(true, {
      echoCancellation: true, noiseSuppression: true, autoGainControl: true,
    });
    $("end").style.display = "";
    status("接続しました。まもなくアドバイザーが話しかけます。イヤホンの利用がおすすめです。");
  } catch (e) {
    status("エラー: " + e.message);
    $("start").disabled = false;
  }
};

$("end").onclick = async () => {
  if (!room) return;
  $("end").disabled = true;
  status("下書きを作っています(そのままお待ちください)…");
  await room.localParticipant.publishData(
    new TextEncoder().encode(JSON.stringify({ type: "end" })),
    { reliable: true, topic: "voice-resume" }
  );
};
</script>
</body>
</html>
